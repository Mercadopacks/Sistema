name: Reconciliar Fallidos y Cambios viejos

# `vincular_choferes_envios.py` (ver publicar_supabase.yml) solo refresca
# estado/logistica_inversa_real en vivo para envíos dentro de
# RANGO_DIAS_LIVE (3 días) — más allá de eso, un envío puede quedar con
# `logistica_inversa_real=true` (o un `estado` de Fallido) para siempre
# aunque Lightdata ya lo haya corregido, porque nunca se vuelve a
# consultar. Bug real 2026-11-20: tracking "2960" (FLIA HDC GROUP S.R.L.)
# con logistica_inversa="no" (texto libre, correcto) pero
# logistica_inversa_real=true desde el 17/11, nunca más re-chequeado.
#
# Este workflow corre 1 vez por día `backfill_estado_fallidos_viejos.py`
# (scripts/), que reconsulta en Lightdata, un tracking a la vez, TODOS los
# candidatos actuales de Fallidos/Cambios (estado en
# parametros_fallidos_mapeo salvo "A retirar", logistica_inversa_real=true,
# o con caso pendiente en fallidos_seguimiento) y corrige estado +
# logistica_inversa_real contra el valor real de Lightdata en ese momento.
# No se agregó al ciclo de cada 10 min (publicar_supabase.yml) a propósito:
# son ~1.5s por tracking, con cientos de candidatos puede tardar varios
# minutos — correrlo cada 10 min sería caro y podría superponerse con la
# corrida siguiente.
#
# Secrets: los mismos que publicar_supabase.yml, de este mismo repo.

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC = 05:00 ART, antes del horario operativo (11:00 ART)
  workflow_dispatch: {}

concurrency:
  group: backfill-fallidos-viejos
  cancel-in-progress: false

jobs:
  reconciliar:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mercadopacks/mercadopacks-metricas-diarias/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar dependencias extra (supabase, python-dotenv)
        working-directory: scripts
        run: pip install -r requirements_supabase.txt

      - name: Reconciliar Fallidos y Cambios viejos contra Lightdata
        working-directory: scripts/fallidos_y_cambios
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 backfill_estado_fallidos_viejos.py

      - name: Subir captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-backfill-fallidos
          path: scripts/ingesta_lightdata/error_descarga.png
          if-no-files-found: ignore
