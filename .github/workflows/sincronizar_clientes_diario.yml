name: Sincronizar clientes de Lightdata

# Pedido 2026-11-20: el ABM de Usuarios necesita asociar un usuario tipo
# "Cliente" a un cliente real de Lightdata, buscado por nombre en un
# combo — hace falta tener `lightdata_clientes` actualizada para eso (ver
# docs/lightdata_api_clientes.md). Los clientes cambian poco (altas/bajas
# ocasionales), así que 1 vez por día alcanza — no hace falta en el ciclo
# de cada 10 min de publicar_supabase.yml.
#
# Desde 2026-11-20 (mismo día) también sincroniza `lightdata_cuentas`
# (módulo "Clientes" de Configuración) — el script ahora pide `getCliente`
# por cada cliente además de `getClientes`, así que tarda más (~1.5-2.5
# min para ~297 clientes en vez de ~20s) — sigue siendo liviano para 1 vez
# por día.
#
# Secrets: los mismos que publicar_supabase.yml, de este mismo repo.

on:
  schedule:
    - cron: '30 8 * * *'  # 08:30 UTC = 05:30 ART, después de la reconciliación de Fallidos
  workflow_dispatch: {}

concurrency:
  group: sincronizar-clientes-lightdata
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mercadopacks/mercadopacks-metricas-diarias/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar dependencias extra (supabase, python-dotenv)
        working-directory: scripts
        run: pip install -r requirements_supabase.txt

      - name: Sincronizar lightdata_clientes
        working-directory: scripts/ingesta_lightdata
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 sincronizar_clientes_lightdata.py

      - name: Subir captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-sincronizar-clientes
          path: scripts/ingesta_lightdata/error_descarga.png
          if-no-files-found: ignore
