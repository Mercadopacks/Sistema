name: Publicar a Supabase

# Automatiza la ingesta de LightData -> Supabase para Mercadopacks Sistema.
# Hasta 2026-11-16 este workflow vivía en el repo
# mercadopacks-metricas-diarias (production, Firestore) — se separó acá
# junto con el resto del repo "Sistema" (ver reglas_de_negocio.md de este
# repo, sección "Separación de repos").
#
# Cuenta de LightData PROPIA y distinta (2026-11-16, decisión del
# usuario): este workflow NO usa la misma cuenta que `descarga_diaria.yml`
# del otro repo — por eso los secrets LIGHTDATA_USER/LIGHTDATA_PASS de
# ESTE repo tienen que cargarse con un login de LightData dedicado a este
# pipeline, nunca copiando las credenciales de producción. Con cuentas
# distintas, Playwright nunca comparte sesión entre los dos pipelines, así
# que no hay riesgo real de que se pisen entre sí — no hace falta
# coordinar horarios con el otro repo (antes, cuando compartían cuenta,
# sí hacía falta; ver el historial en reglas_de_negocio.md de este repo).
#
# Disparo: workflow_dispatch vía cron-job.org (el `schedule:` nativo de
# GitHub Actions llega con 4-5h de atraso, medido en el pipeline de
# producción — no usar).
# Configuración en cron-job.org: 1 job, cada 10 min, SOLO en horario
# operativo (11:00-21:00 ART = 14:00-24:00 UTC, lunes a sábado) — de noche
# no entran paquetes nuevos al depósito, correrlo igual no suma nada.
#   URL:     https://api.github.com/repos/Mercadopacks/Sistema/actions/workflows/publicar_supabase.yml/dispatches
#   Método:  POST
#   Headers: Authorization: Bearer <PERSONAL_ACCESS_TOKEN>
#            Accept: application/vnd.github+json
#            Content-Type: application/json
#   Body:    {"ref":"main","inputs":{}}
#
# Secrets que necesita este workflow en GitHub (Settings > Secrets and
# variables > Actions de ESTE repo — son propios, no se heredan del otro):
#   LIGHTDATA_USER / LIGHTDATA_PASS  - cuenta de LightData DEDICADA a este pipeline (no la de producción)
#   SUPABASE_URL                     - URL del proyecto de Supabase
#   SUPABASE_SERVICE_ROLE_KEY        - Service role key de ese proyecto
#
# También se puede disparar a mano: pestaña "Actions" de este repo >
# "Publicar a Supabase" > "Run workflow". "Fecha" vacío = hoy (ART).

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a descargar y subir (YYYY-MM-DD). Vacío = hoy (ART).'
        required: false
        default: ''

# Encola corridas de ESTE workflow entre sí (ej. una corrida atrasada +
# un disparo manual al mismo tiempo) — ya NO protege contra
# descarga_diaria.yml del otro repo, ver nota arriba.
concurrency:
  group: publicar-supabase
  cancel-in-progress: false

jobs:
  descargar-y-publicar:
    runs-on: ubuntu-latest
    # Reusa la imagen de CI del repo de producción (Python + Playwright/
    # Chromium + LibreOffice + requirements.txt ya instalados) en vez de
    # mantener un Dockerfile/build propio duplicado — es infraestructura
    # de build genérica, no lógica de negocio, así que no hace falta
    # separarla. Si falla el pull por permisos de paquete (packages
    # privados no siempre son visibles cruzando repos aunque sea el mismo
    # org), hay que poner el paquete como público en
    # github.com/orgs/Mercadopacks/packages.
    container:
      image: ghcr.io/mercadopacks/mercadopacks-metricas-diarias/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      # supabase/python-dotenv no están en la imagen base (son solo de
      # este pipeline) — se instalan aparte en cada corrida.
      - name: Instalar dependencias extra (supabase, python-dotenv)
        working-directory: scripts
        run: pip install -r requirements_supabase.txt

      - name: Descargar de LightData y publicar a Supabase
        working-directory: scripts
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          set -e
          if [ -n "$FECHA_INPUT" ]; then
            FECHA_DESCARGA="$FECHA_INPUT"
          else
            FECHA_DESCARGA=$(date -u -d "-3 hours" +%F)  # ART = UTC-3
          fi
          export FECHA_DESCARGA
          SALIDA=$(python3 descargar_lightdata.py)
          echo "$SALIDA"
          RUTA=$(echo "$SALIDA" | tail -n1 | sed 's/^Archivo descargado: //')
          python3 publicar_supabase.py "$RUTA"

      # Sincroniza usuarios de Lightdata -> lightdata_usuarios/choferes_roster
      # (ver integracion_usuarios_lightdata.md, raíz del repo). `continue-on-error`
      # a propósito: este endpoint interno de Lightdata no es oficial y puede
      # cambiar de formato sin aviso — si falla, NO debe tumbar la publicación
      # de envíos (lo que sí importa en cada corrida), queda para revisar aparte.
      - name: Sincronizar usuarios de Lightdata (roster de repartidores)
        working-directory: scripts
        continue-on-error: true
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 sincronizar_lightdata.py --live

      # Completa envios.chofer_lightdata_id con el ID real de Lightdata
      # (didcadete, ver lightdata_api_envios.md) — cruzar por ID en vez de
      # por nombre evita bugs como el de "Fiorella  Souza" (doble espacio
      # en Lightdata) que no matcheaba contra el roster. `continue-on-error`
      # por la misma razón que el paso de arriba: endpoint interno no
      # oficial, nunca debe tumbar la publicación de envíos.
      #
      # IMPORTANTE (bug real 2026-11-19): este paso forzaba SIEMPRE
      # FECHA_DESCARGA a hoy, aunque el script ya soporta un rango de
      # varios días (RANGO_DIAS_LIVE, ver vincular_choferes_envios.py) —
      # con FECHA_DESCARGA seteada, el script ignora el rango y vuelve al
      # modo de un solo día de siempre. Resultado: el fix de "refrescar
      # también los casos de Fallidos de días anteriores" nunca se activaba
      # en producción pese a estar deployado (caso real: tracking
      # 48553756312, 2 días de antigüedad, seguía sin refrescarse después
      # del fix). Ahora SOLO se fuerza una fecha puntual cuando el
      # workflow_dispatch trae un input manual — en la corrida normal del
      # cron, FECHA_DESCARGA queda sin setear y el script usa su rango por
      # defecto (3 días, ver el docstring del script para por qué ese
      # número y no uno más grande).
      - name: Vincular choferes a envíos (por ID de Lightdata)
        working-directory: scripts
        continue-on-error: true
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA_INPUT" ]; then
            export FECHA_DESCARGA="$FECHA_INPUT"
          fi
          python3 vincular_choferes_envios.py

      - name: Subir captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-publicar-supabase
          path: scripts/error_descarga.png
          if-no-files-found: ignore
